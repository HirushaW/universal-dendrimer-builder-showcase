<svg xmlns="http://www.w3.org/2000/svg" viewBox="-230 -230 460 460" width="460" height="460">
  <defs>
    <!-- One arm: trunk pointing up, then two secondary branches, each with two tertiary branches -->
    <g id="arm">
      <!-- G1 trunk -->
      <line x1="0" y1="0" x2="0" y2="-72" stroke="#14b8a6" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
      <circle cx="0" cy="-72" r="5" fill="#0d9488" opacity="0.6"/>

      <!-- G2 left -->
      <g transform="translate(0,-72) rotate(-44)">
        <line x1="0" y1="0" x2="0" y2="-55" stroke="#2dd4bf" stroke-width="2.2" stroke-linecap="round" opacity="0.8"/>
        <circle cx="0" cy="-55" r="4" fill="#14b8a6" opacity="0.5"/>
        <!-- G3 left-left -->
        <g transform="translate(0,-55) rotate(-34)">
          <line x1="0" y1="0" x2="0" y2="-42" stroke="#5eead4" stroke-width="1.6" stroke-linecap="round" opacity="0.7"/>
          <circle cx="0" cy="-42" r="5.5" fill="#5eead4" opacity="0.85"/>
        </g>
        <!-- G3 left-right -->
        <g transform="translate(0,-55) rotate(34)">
          <line x1="0" y1="0" x2="0" y2="-42" stroke="#5eead4" stroke-width="1.6" stroke-linecap="round" opacity="0.7"/>
          <circle cx="0" cy="-42" r="5.5" fill="#5eead4" opacity="0.85"/>
        </g>
      </g>

      <!-- G2 right -->
      <g transform="translate(0,-72) rotate(44)">
        <line x1="0" y1="0" x2="0" y2="-55" stroke="#2dd4bf" stroke-width="2.2" stroke-linecap="round" opacity="0.8"/>
        <circle cx="0" cy="-55" r="4" fill="#14b8a6" opacity="0.5"/>
        <!-- G3 right-left -->
        <g transform="translate(0,-55) rotate(-34)">
          <line x1="0" y1="0" x2="0" y2="-42" stroke="#5eead4" stroke-width="1.6" stroke-linecap="round" opacity="0.7"/>
          <circle cx="0" cy="-42" r="5.5" fill="#5eead4" opacity="0.85"/>
        </g>
        <!-- G3 right-right -->
        <g transform="translate(0,-55) rotate(34)">
          <line x1="0" y1="0" x2="0" y2="-42" stroke="#5eead4" stroke-width="1.6" stroke-linecap="round" opacity="0.7"/>
          <circle cx="0" cy="-42" r="5.5" fill="#5eead4" opacity="0.85"/>
        </g>
      </g>
    </g>

    <!-- Radial glow gradient -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background glow -->
  <circle cx="0" cy="0" r="220" fill="url(#glow)"/>

  <!-- 4 arms at 45°, 135°, 225°, 315° (PAMAM EDA core geometry) -->
  <use href="#arm" transform="rotate(45)"/>
  <use href="#arm" transform="rotate(135)"/>
  <use href="#arm" transform="rotate(225)"/>
  <use href="#arm" transform="rotate(315)"/>

  <!-- Core node rings -->
  <circle cx="0" cy="0" r="18" fill="none" stroke="#14b8a6" stroke-width="1.5" opacity="0.3"/>
  <circle cx="0" cy="0" r="12" fill="#0d9488" opacity="0.8"/>
  <circle cx="0" cy="0" r="7" fill="#14b8a6"/>
  <circle cx="0" cy="0" r="3.5" fill="#5eead4"/>

  <!-- Generation ring guides (subtle) -->
  <circle cx="0" cy="0" r="72" fill="none" stroke="#14b8a6" stroke-width="0.5" stroke-dasharray="3 6" opacity="0.15"/>
  <circle cx="0" cy="0" r="127" fill="none" stroke="#14b8a6" stroke-width="0.5" stroke-dasharray="3 6" opacity="0.10"/>
  <circle cx="0" cy="0" r="182" fill="none" stroke="#14b8a6" stroke-width="0.5" stroke-dasharray="3 6" opacity="0.06"/>

  <!-- Generation labels -->
  <text x="76" y="4" fill="#14b8a6" font-family="JetBrains Mono, monospace" font-size="10" opacity="0.4">G1</text>
  <text x="131" y="4" fill="#2dd4bf" font-family="JetBrains Mono, monospace" font-size="10" opacity="0.35">G2</text>
  <text x="186" y="4" fill="#5eead4" font-family="JetBrains Mono, monospace" font-size="10" opacity="0.3">G3</text>
</svg>
